seed: 6304

dataset:
  name: stl10          # stl10 | oxford_pets
  root: ./data_raw
  image_size: 224
  train_val_split: 0.8  # stratified 80/20 from official training partition

subset:
  n_test_images: 500    # class-balanced subset from official test split
  ids_path: ./data/subset_ids.json

backbones:
  resnet50:
    weights: IMAGENET1K_V2
  vit_b_16:
    weights: IMAGENET1K_V1
  clip_vit_b_32:
    pretrained: openai

classifier_head:
  max_epochs: 50
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  early_stop_patience: 5

clip_zeroshot:
  prompt_template: "a photo of a {class}."

color_bias:
  extra_transform: hue_rotation   # hue_rotation | palette_transfer | class_swapped_stats
  hue_rotation_degrees: 90        # fill in your chosen fixed value

cue_conflict:
  method: adain
  n_class_pairs: 5                # >= 5 unordered pairs, state your choice + hypothesis
  style_strength: 1.0              # AdaIN alpha, state your choice + hypothesis
  min_valid_conflicts: 200
  both_directions: true

translation:
  offsets_px: [0, 8, 16, 32]
  directions: [up, down, left, right]
  padding_mode: reflect

patch_shuffle:
  grid: [4, 4]

representation_analysis:
  method: tsne          # tsne | umap
  interventions: [grayscale, cue_conflict, translation, patch_shuffle]
  tsne_perplexity: 30    # state your chosen settings in the report
  umap_n_neighbors: 15
